[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aura-shreds-sdk"
version = "0.1.0"
description = "Subscriber client for the aura-shreds Solana shred stream"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
keywords = ["solana", "shred", "aura-shreds", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
# No required dependencies. Python 3.14 carries zstd in the standard library, which is all a
# subscriber needs beyond asyncio — the same reasoning as the TypeScript SDK requiring Node 22.15.
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/aura_shreds_sdk"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
