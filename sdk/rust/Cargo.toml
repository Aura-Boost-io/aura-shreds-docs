[package]
name = "aura-shreds-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Subscriber client for the aura-shreds Solana shred stream"
readme = "README.md"
keywords = ["solana", "shred", "aura-shreds", "streaming"]
categories = ["network-programming"]

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[dependencies]
sha2 = "0.10"
hmac = "0.12"
rand = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "rt"] }
zstd = "0.13"

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
